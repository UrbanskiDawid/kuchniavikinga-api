# Pushing a tag like v1.2.3 runs the tests; the GitHub release is only
# created if they pass. A failing test stops the release.
name: release
on:
  push:
    tags: ["v*"]
jobs:
  test:
    uses: ./.github/workflows/test.yml
  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME" ${{ contains(github.ref_name, '-') && '--prerelease' || '' }}
      - name: Warm the Go module proxy
        run: curl -fsS "https://proxy.golang.org/github.com/!urbanski!dawid/kuchniavikinga-api/@v/${GITHUB_REF_NAME}.info"
